    Experience:
      - company: The Hong Kong University of Science and Technology (Guangzhou)
        position: Doctoral Researcher
        location: Guangzhou, China
        start_date: 2023-05
        end_date: present
        summary: Research on audio-visual intelligence, multimodal large language models, model reliability, and assistive speech technologies.
        highlights:
          - Developed few-shot audio-visual learning methods using semantic prompts, adapters, latent attention, and prototype regularization.
          - Built training-free and semi-training-free cued speech recognition systems with multimodal agents and MLLM-driven hand modeling.
          - Studied audio deepfake detection, physically grounded audio-visual generation benchmarks, and evidential uncertainty for in-context learning.
          - Contributed to multimodal assessment systems for people with hearing impairment using speech, video, text, and fNIRS signals.

      - company: Suzhou INSNEX Intelligent Technology Co., Ltd.
        position: Deep Learning Algorithm Engineer
        location: Suzhou, China
        start_date: 2022-05
        end_date: 2023-05
        summary: Developed industrial visual inspection algorithms for defect synthesis and detection.
        highlights:
          - Designed GAN-based defect generation methods for data augmentation and industrial inspection; the work contributed to a patent.
          - Built generation, detection, and multi-task training pipelines for low-data defect scenarios.

      - company: Shenzhen Research Institute of Big Data
        position: Algorithm Engineer
        location: Shenzhen, China
        start_date: 2021-04
        end_date: 2022-05
        summary: Worked on large-scale multimodal UAV tracking datasets and learning-assisted optimization.
        highlights:
          - Co-developed WebUAV-3M, containing 3.3 million frames from 4,500 videos across 223 categories, together with semi-automatic annotation tools and language/audio modalities.
          - Explored deep-learning acceleration for mixed-integer linear programming and developed Python evaluation, testing, and visualization tools.

      - company: Australian National University
        position: Master's Researcher
        location: Canberra, Australia
        start_date: 2020-03
        end_date: 2020-12
        summary: Researched unified image style transfer methods.

      - company: CSIRO
        position: Research Assistant
        location: Canberra, Australia
        start_date: 2019-07
        end_date: 2019-11
        summary: Developed interactive 3D geological visualization tools with PyVista and reproducible Binder environments.

    Selected Projects:
      - name: Cued-Agent
        summary: A training-free multi-agent framework for cued speech recognition that coordinates visual perception, hand-cue fusion, and LLM-based phoneme-to-word correction.
        highlights:
          - ACM Multimedia 2025 Oral; Student Travel Award.
          - Released code and a Mandarin cued speech dataset for speakers with hearing impairment.
        start_date: 2024
        end_date: 2025

      - name: STF-ACSR
        summary: Semi training-free cued speech recognition using MLLM-driven hand-keyframe modeling and lightweight multimodal fusion.
        highlights:
          - Accepted at ICASSP 2026.
          - Public implementation released on GitHub.
        start_date: 2025
        end_date: 2026

      - name: Semantic Modulated Prompting
        summary: A parameter-efficient few-shot audio-visual classification method combining semantic adapters, prompt latent attention, and prompted prototype regularization.
        highlights:
          - Published in IEEE/ACM Transactions on Audio, Speech, and Language Processing, 2026.
        start_date: 2024
        end_date: 2026

      - name: PhyAVBench
        summary: A controlled benchmark for evaluating whether audio-visual generation models obey physical interactions and cross-modal consistency.
        highlights:
          - Core contributor; ACM Multimedia 2026 Oral.
          - Includes 1,000 paired prompts with more than 20 generated videos per group.
        start_date: 2025
        end_date: 2026

      - name: Evidential Uncertainty for In-Context Learning
        summary: Query-level evidential uncertainty methods for language-model in-context learning, evaluated across five datasets and multiple LLaMA and Qwen models.
        highlights:
          - Reduced average token usage by 96.7% in the evaluated setting.
        start_date: 2025
        end_date: present

